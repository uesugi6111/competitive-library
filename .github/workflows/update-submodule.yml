name: Dispatch library update

on:
  workflow_dispatch:

permissions: {}

jobs:
  dispatch:
    name: Notify ${{ matrix.repository }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        repository:
          - uesugi6111/AtCoder-archives-Rust
          - uesugi6111/codeforces-submission
    steps:
      - name: Send repository dispatch
        env:
          GH_TOKEN: ${{ secrets.AUTO_PR_TOKEN }}
          REPOSITORY: ${{ matrix.repository }}
        run: |
          curl --fail-with-body \
            --request POST \
            --url "https://api.github.com/repos/${REPOSITORY}/dispatches" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data '{"event_type":"update-submodule"}'
