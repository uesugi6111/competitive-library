name: library-test

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * 6"

permissions:
  contents: read

concurrency:
  group: library-test-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: 1.89.0

jobs:
  quality:
    name: Format, Clippy, and docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        run: >-
          rustup toolchain install "$RUST_VERSION"
          --profile minimal
          --component clippy
          --component rustfmt

      - name: Format
        run: cargo +${RUST_VERSION} fmt --all -- --check

      - name: Clippy
        run: cargo +${RUST_VERSION} clippy --workspace --all-targets -- -D warnings

      - name: Documentation
        run: cargo +${RUST_VERSION} doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  atcoder:
    name: AtCoder (Rust 1.89.0, edition 2024)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        run: rustup toolchain install "$RUST_VERSION" --profile minimal

      - name: Build as AtCoder does
        run: cargo +${RUST_VERSION} build --workspace --all-targets --release --offline

      - name: Test release build
        run: >-
          cargo +${RUST_VERSION} test
          --workspace
          --all-targets
          --release
          --offline
          --no-fail-fast
        env:
          RUST_BACKTRACE: full

  codeforces:
    name: Codeforces (Rust 1.89.0, edition 2024)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        run: rustup toolchain install "$RUST_VERSION" --profile minimal

      - name: Prepare output directory
        run: mkdir -p target/codeforces

      - name: Compile with rustc
        run: >-
          rustc +${RUST_VERSION}
          --edition=2024
          --crate-name competitive_library
          --crate-type lib
          -O
          --cfg ONLINE_JUDGE
          src/lib.rs
          --out-dir target/codeforces
